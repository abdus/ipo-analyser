[project]
name = "ipo-analyser"
version = "0.1.0"
description = "Self-contained Indian IPO listing-gain dashboard with multi-source GMP tracking"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4>=4.13.4",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic-settings>=2.10.1",
    "psycopg[binary]>=3.2.9",
    "sqlalchemy>=2.0.43",
    "typer>=0.16.0",
    "uvicorn[standard]>=0.35.0",
]

[project.scripts]
ipo-analyser = "ipo_analyser.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-cov>=6.2.1",
    "ruff>=0.12.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ipo_analyser"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
