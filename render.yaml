services:
  - type: web
    name: ipo-analyser
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeployTrigger: commit
    initialDeployHook: /app/.venv/bin/ipo-analyser collect
    envVars:
      - key: IPO_DATABASE_URL
        fromDatabase:
          name: ipo-analyser-db
          property: connectionString

  - type: cron
    name: ipo-analyser-refresh
    runtime: docker
    plan: starter
    region: singapore
    dockerfilePath: ./Dockerfile
    schedule: "30 */2 * * *"
    dockerCommand: /app/.venv/bin/ipo-analyser collect --json
    envVars:
      - key: IPO_DATABASE_URL
        fromDatabase:
          name: ipo-analyser-db
          property: connectionString

databases:
  - name: ipo-analyser-db
    plan: basic-256mb
    region: singapore
    diskSizeGB: 1
    databaseName: ipo_analyser
    user: ipo_analyser
    ipAllowList: []
